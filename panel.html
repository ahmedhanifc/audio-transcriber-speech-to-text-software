<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Audio Transcriber</title>
<link rel="stylesheet" href="vendor/katex.min.css">
<script src="vendor/katex.min.js"></script>
<script src="vendor/marked.js"></script>
<style>
  :root { --bg: #f7f7f5; --card: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5e5; --accent: #1d1d1f; --red: #d93025; --todo: #fff3bf; --doing: #dbeafe; --done: #dcfce7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --card: #2c2c2e; --text: #f2f2f7; --muted: #98989d; --line: #3a3a3c; --accent: #f2f2f7; --todo: #4a4126; --doing: #1f3a5c; --done: #1f4030; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; }
  nav { width: 160px; padding: 20px 10px; border-right: 1px solid var(--line); }
  nav button { display: block; width: 100%; text-align: left; padding: 8px 12px; margin-bottom: 4px; border: 0; border-radius: 8px; background: none; color: var(--text); font: inherit; cursor: pointer; }
  nav button.on { background: var(--card); font-weight: 600; }
  main { flex: 1; padding: 24px; overflow-y: auto; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 12px; }
  input, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 90px; resize: vertical; margin-bottom: 8px; }
  button.act { padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); font: inherit; cursor: pointer; white-space: nowrap; }
  button.main { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button.stop { background: var(--red); color: #fff; border-color: var(--red); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.live { color: var(--red); border-color: var(--red); }
  pre { white-space: pre-wrap; font: inherit; margin: 10px 0 8px; padding: 10px 4px 0 0; border-top: 1px solid var(--line); max-height: 45vh; overflow-y: auto; }
  .text { white-space: pre-wrap; }
  .hidden { display: none; }
  .tabs { margin-bottom: 12px; }
  .tabs button.on, .chips button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  label { display: block; font-weight: 600; }
  label textarea { min-height: 60px; margin-top: 4px; font-weight: normal; }
  h3 { font-size: 15px; margin: 0 0 8px; }
  .entry { margin-top: 8px; }
  .chips { margin-bottom: 12px; gap: 6px; }
  .chips .act { padding: 3px 10px; border-radius: 99px; font-size: 12px; }
  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; align-items: start; }
  .sticky { min-height: 110px; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; cursor: text; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
  .sticky .text { flex: 1; }
  .sticky.todo { background: var(--todo); }
  .sticky.doing { background: var(--doing); }
  .sticky.done { background: var(--done); opacity: .6; }
  .sticky.add { align-items: center; justify-content: center; font-size: 28px; color: var(--muted); border: 1px dashed var(--line); box-shadow: none; cursor: pointer; }
  .sticky textarea { flex: 1; min-height: 86px; margin: 0; padding: 0; border: 0; background: none; resize: none; outline: none; }
  .pill { padding: 2px 10px; border: 0; border-radius: 99px; background: rgba(0, 0, 0, .08); color: var(--text); font: inherit; font-size: 12px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .pill { background: rgba(255, 255, 255, .12); } }
  #ask:not(.hidden) { display: flex; flex-direction: column; height: 100%; }
  #ask > .row { margin-bottom: 8px; }
  #chat-list .card { cursor: pointer; }
  #messages { flex: 1; overflow-y: auto; position: relative; }
  #ask-box { min-height: 64px; margin: 8px 0 0; resize: none; }
  .md { margin-bottom: 14px; overflow-wrap: break-word; }
  .md pre { white-space: pre; overflow-x: auto; max-height: none; margin: 8px 0; padding: 10px; border: 0; border-radius: 8px; background: var(--card); }
  .md code { font: 12px ui-monospace, monospace; }
  .md table { border-collapse: collapse; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; }
  .md .katex-display { overflow-x: auto; overflow-y: hidden; }
  mark { background: #ffe58f; color: #1d1d1f; border-radius: 3px; }
</style>
</head>
<body>
<nav>
  <button data-tab="meetings" class="on">Meetings</button>
  <button data-tab="history">History</button>
  <button data-tab="notes">Notes</button>
  <button data-tab="ask">Ask</button>
</nav>
<main>
  <section id="meetings">
    <h1>Meetings</h1>
    <div class="card row" id="recorder"></div>
    <div id="meeting-list"></div>
  </section>
  <section id="history" class="hidden">
    <h1>History</h1>
    <div class="row tabs">
      <button class="act on" data-sub="dictation-list">Dictations</button>
      <button class="act" data-sub="chat-list">Chats</button>
    </div>
    <div id="dictation-list" class="sub"></div>
    <div id="chat-list" class="sub hidden"></div>
  </section>
  <section id="notes" class="hidden">
    <h1>Notes</h1>
    <div class="row tabs">
      <button class="act on" data-sub="inbox">Inbox</button>
      <button class="act" data-sub="today">Today</button>
      <button class="act" data-sub="past">Past</button>
    </div>
    <div id="inbox" class="sub">
      <div class="row chips">
        <button class="act on" data-filter="">All</button>
        <button class="act" data-filter="todo">To do</button>
        <button class="act" data-filter="doing">Doing</button>
        <button class="act" data-filter="done">Done</button>
      </div>
      <div id="board" class="board"></div>
    </div>
    <div id="today" class="sub hidden">
      <div class="card" id="reflection">
        <div class="row"><button class="act main" id="save-reflection">Save</button><span class="muted" id="reflection-day"></span></div>
      </div>
    </div>
    <div id="past" class="sub hidden">
      <input id="search" placeholder="Search notes and reflections" style="margin-bottom: 10px">
      <div id="past-list"></div>
    </div>
  </section>
  <section id="ask" class="hidden">
    <div class="row">
      <button class="act" id="new-chat">New chat</button>
    </div>
    <div id="messages"></div>
    <textarea id="ask-box" placeholder="Ask anything. Paste file or screenshot paths. Enter sends, Shift+Enter is a new line."></textarea>
  </section>
</main>
<script>
  let state = null;
  let last = '';
  const open = new Set();
  let editing = null; // meeting id being renamed: re-rendering would steal the input
  let editingNote = null;
  let filter = '';
  const STATUS = { todo: 'To do', doing: 'Doing', done: 'Done' };
  const NEXT = { todo: 'doing', doing: 'done', done: 'todo' };
  const LABELS = { did: 'What I did', learned: 'What I learned', blocked: 'What blocked me', better: 'What to do better', people: 'People' };
  const today = () => new Date().toLocaleDateString('en-CA');

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }
  const button = (text, cls, onclick) => el('button', { className: 'act ' + cls, textContent: text, onclick });
  const copyButton = (text, value) => button(text, '', async (e) => {
    await pywebview.api.copy(value);
    e.target.textContent = 'Copied!';
    setTimeout(() => e.target.textContent = text, 1500);
  });
  const when = (iso) => new Date(iso).toLocaleString();

  function clock(seconds) {
    const s = Math.max(0, Math.floor(seconds));
    return [s / 3600, (s % 3600) / 60, s % 60].map((n) => String(Math.floor(n)).padStart(2, '0')).join(':');
  }

  function status(m) {
    if (state.recording?.sessionId === m.id) return ['Recording', 'live'];
    if (m.error) return ['Failed', ''];
    if (m.state === 'transcribed') return ['Done', ''];
    if (!m.transcribe) return ['Audio only', ''];
    return ['Transcribing…', 'live'];
  }

  function renderRecorder() {
    const box = document.getElementById('recorder');
    const rec = state.recording;
    if (rec) {
      box.replaceChildren(
        el('span', { className: 'badge live', textContent: '● Recording' }),
        el('span', { className: 'grow', id: 'timer' }),
        button('Stop', 'stop', async () => { await pywebview.api.stop_meeting(); refresh(); }),
      );
      tick();
    } else if (!box.querySelector('input')) {
      const title = el('input', { className: 'grow', placeholder: 'Meeting title (optional)' });
      box.replaceChildren(title, button('Start meeting', 'main', async (e) => {
        e.target.disabled = true;
        await pywebview.api.start_meeting(title.value);
        e.target.disabled = false;
        refresh();
      }));
    }
  }

  function toggleTranscript(id) {
    if (open.has(id)) open.delete(id); else open.add(id);
    render(true);
  }

  function rename(m, titleBox) {
    editing = m.id;
    const input = el('input', { value: m.title || '', placeholder: m.id });
    const done = async (save) => {
      if (editing !== m.id) return; // Enter's save also fires blur
      editing = null;
      const title = input.value.trim();
      if (save && title !== (m.title || '')) await pywebview.api.rename_meeting(m.id, title);
      refresh(true);
    };
    input.onkeydown = (e) => { if (e.key === 'Enter') done(true); else if (e.key === 'Escape') done(false); };
    input.onblur = () => done(true);
    titleBox.replaceWith(input);
    input.select();
  }

  async function renderMeetings() {
    const cards = await Promise.all(state.meetings.map(async (m) => {
      const [label, cls] = status(m);
      const title = el('div', { textContent: m.title || m.id, title: 'Double-click to rename', ondblclick: () => rename(m, title) });
      const card = el('div', { className: 'card' }, el('div', { className: 'row' },
        el('div', { className: 'grow' }, title, el('div', { className: 'muted', textContent: when(m.started_at) })),
        m.edited ? el('span', { className: 'badge', textContent: 'Edited' }) : '',
        el('span', { className: 'badge ' + cls, textContent: label, title: m.error || '' }),
        button('Rename', '', () => rename(m, title)),
        m.state === 'transcribed' ? button(open.has(m.id) ? 'Hide' : 'Transcript', '', () => toggleTranscript(m.id)) : '',
        label === 'Recording' ? '' : button('Delete', '', async () => {
          if (!confirm(`Delete "${m.title || m.id}" and its audio?`)) return;
          await pywebview.api.delete_meeting(m.id);
          refresh();
        }),
      ));
      if (m.error) card.append(el('div', { className: 'muted', textContent: m.error }));
      if (open.has(m.id)) {
        const text = await pywebview.api.transcript(m.id);
        const note = el('input', { className: 'grow', placeholder: 'Add to minutes' });
        const add = async () => {
          if (!note.value.trim()) return;
          await pywebview.api.append_transcript(m.id, note.value.trim());
          note.blur();
          refresh(true);
        };
        note.onkeydown = (e) => e.key === 'Enter' && add();
        card.append(el('pre', { textContent: text }), el('div', { className: 'row' },
          note,
          button('Add', '', add),
          copyButton('Copy transcript', text),
          button('Edit', '', () => editTranscript(m.id, text, card)),
        ));
      }
      return card;
    }));
    document.getElementById('meeting-list').replaceChildren(...cards);
  }

  function editTranscript(id, text, card) {
    editing = id;
    const box = el('textarea', { value: text, style: 'height: 45vh' });
    const done = async (save) => {
      if (save && box.value !== text) await pywebview.api.save_transcript(id, box.value);
      editing = null;
      render(true);
    };
    card.querySelector('pre').replaceWith(box);
    box.onkeydown = (e) => {
      if (e.key === 'Enter' && e.ctrlKey) done(true);
      else if (e.key === 'Escape') done(false);
    };
    card.lastChild.replaceWith(el('div', { className: 'row' }, button('Save', 'main', () => done(true)), button('Cancel', '', () => done(false))));
    box.focus();
  }

  // n is null for a new note. Clearing a note's text deletes it.
  function editSticky(n, card) {
    editingNote = n ? n.id : 'new';
    const box = el('textarea', { value: n ? n.text : '' });
    box.onblur = async () => {
      const text = box.value.trim();
      if (!n && text) await pywebview.api.add_note(text);
      else if (n && !text) await pywebview.api.delete_note(n.id);
      else if (n && text !== n.text) await pywebview.api.update_note(n.id, text);
      editingNote = null;
      refresh(true);
    };
    box.onkeydown = (e) => {
      if (e.key === 'Escape') box.value = n ? n.text : '';
      if (e.key === 'Escape' || (e.key === 'Enter' && e.ctrlKey)) box.blur();
    };
    card.onclick = null;
    card.className = 'sticky ' + (n ? n.status : 'todo');
    card.replaceChildren(box);
    box.focus();
    box.setSelectionRange(box.value.length, box.value.length);
  }

  function renderBoard() {
    const add = el('div', { className: 'sticky add', textContent: '+', onclick: (e) => editSticky(null, e.currentTarget) });
    document.getElementById('board').replaceChildren(...state.notes.filter((n) => !filter || n.status === filter).map((n) =>
      el('div', { className: 'sticky ' + n.status, onclick: (e) => editSticky(n, e.currentTarget) },
        el('div', { className: 'text', textContent: n.text }),
        el('div', { className: 'row' },
          el('button', { className: 'pill', textContent: STATUS[n.status], onclick: async (e) => {
            e.stopPropagation();
            await pywebview.api.set_note_status(n.id, NEXT[n.status]);
            refresh();
          } }),
          el('span', { className: 'muted grow', textContent: new Date(n.created_at).toLocaleDateString() }),
        ),
      )), add);
  }

  function renderList(id, items, onDelete) {
    document.getElementById(id).replaceChildren(...items.map((d) => el('div', { className: 'card row' },
      el('div', { className: 'grow' }, el('div', { className: 'text', textContent: d.text }), el('div', { className: 'muted', textContent: when(d.created_at) })),
      copyButton('Copy', d.text),
      button('Delete', '', async () => { await onDelete(d.id); refresh(); }),
    )));
  }

  function render(force) {
    const snapshot = JSON.stringify(state);
    if (!force && snapshot === last) return;
    last = snapshot;
    renderRecorder();
    // A focused "Add to minutes" box would lose its text if the list re-rendered.
    if (!editing && (force || !document.getElementById('meeting-list').contains(document.activeElement))) renderMeetings();
    renderList('dictation-list', state.dictations, (id) => pywebview.api.delete_dictation(id));
    if (editingNote === null) renderBoard();
  }

  async function refresh(force = false) {
    state = await pywebview.api.state();
    render(force);
  }

  function tick() {
    const timer = document.getElementById('timer');
    if (timer && state.recording) timer.textContent = clock((Date.now() - new Date(state.recording.startedAt)) / 1000);
  }

  document.querySelectorAll('nav button').forEach((b) => b.onclick = () => {
    document.querySelectorAll('nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('main section').forEach((s) => s.classList.toggle('hidden', s.id !== b.dataset.tab));
    if (b.dataset.tab === 'history') loadChats();
  });

  let chat = null; // file name of the open chat, null for a new one
  let live = null; // the answer being streamed in
  let liveText = '';
  const messages = document.getElementById('messages');
  const askBox = document.getElementById('ask-box');

  // Show raw HTML from answers as text, so it can't run scripts in the panel.
  marked.use({ renderer: { html: ({ text }) => text.replace(/&/g, '&amp;').replace(/</g, '&lt;') } });

  // Math is pulled out first, or marked would eat its backslashes and underscores.
  function md(text) {
    const math = [];
    const stash = (tex, display) => `@@MATH${math.push({ tex, display }) - 1}@@`;
    text = text.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => stash(t, true)).replace(/\$([^$\n]+?)\$/g, (_, t) => stash(t, false));
    return marked.parse(text).replace(/@@MATH(\d+)@@/g, (_, i) => katex.renderToString(math[i].tex, { displayMode: math[i].display, throwOnError: false }));
  }

  // Again once KaTeX fonts load, since they make the answer taller.
  const toBottom = () => {
    messages.scrollTop = messages.scrollHeight;
    document.fonts.ready.then(() => messages.scrollTop = messages.scrollHeight);
  };

  const message = (role, text) => role === 'You'
    ? el('div', { className: 'card text', textContent: text })
    : el('div', { className: 'md', innerHTML: md(text) });

  async function loadChats() {
    const names = await pywebview.api.chats();
    document.getElementById('chat-list').replaceChildren(...names.map((n) => el('div', {
      className: 'card', onclick: () => { document.querySelector('nav [data-tab="ask"]').click(); openChat(n); },
    }, el('div', { textContent: n.slice(16, -3).replace(/-/g, ' ') }), el('div', { className: 'muted', textContent: n.slice(0, 10) }))));
  }

  async function openChat(name) {
    chat = name;
    messages.replaceChildren(...(name ? await pywebview.api.open_chat(name) : []).map((t) => message(t.role, t.text)));
    toBottom();
  }

  function onPiece(piece) {
    liveText += piece;
    live.className = 'md';
    live.innerHTML = md(liveText);
    toBottom();
  }

  askBox.onkeydown = async (e) => {
    if (e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    const text = askBox.value.trim();
    if (!text || live) return;
    askBox.value = '';
    const from = chat;
    live = el('div', { className: 'md muted', textContent: 'Thinking…' });
    liveText = '';
    messages.append(message('You', text), live);
    toBottom();
    try {
      const name = await pywebview.api.send(from, text);
      live = null;
      if (chat === from) openChat(name);
    } catch (err) {
      live.textContent = 'Error: ' + err;
      live = null;
    }
  };

  document.getElementById('new-chat').onclick = () => { openChat(null); askBox.focus(); };

  messages.onclick = (e) => {
    const a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    pywebview.api.open_url(a.href);
  };

  document.getElementById('reflection').prepend(...Object.entries(LABELS).map(([name, label]) =>
    el('label', {}, label, el('textarea', { name, placeholder: '' }))));

  async function loadToday() {
    document.getElementById('reflection-day').textContent = today();
    const r = await pywebview.api.get_reflection(today());
    document.querySelectorAll('#reflection textarea').forEach((t) => t.value = r[t.name] || '');
  }

  document.getElementById('save-reflection').onclick = async (e) => {
    const fields = {};
    document.querySelectorAll('#reflection textarea').forEach((t) => fields[t.name] = t.value.trim());
    await pywebview.api.save_reflection(today(), fields);
    e.target.textContent = 'Saved!';
    setTimeout(() => e.target.textContent = 'Save', 1500);
  };

  // snippet() wraps matches in \x02 … \x03, so odd pieces are the hits.
  const highlight = (snip) => snip.split(/[\x02\x03]/).map((part, i) => i % 2 ? el('mark', { textContent: part }) : part);

  async function loadPast() {
    const search = document.getElementById('search');
    const q = search.value.trim();
    const cards = q
      ? (await pywebview.api.search(q)).map((h) => el('div', { className: 'card' },
          el('div', { className: 'muted', textContent: h.kind === 'note' ? 'Note · ' + when(h.at) : 'Reflection · ' + h.day }),
          el('div', { className: 'text' }, ...highlight(h.snip))))
      : (await pywebview.api.days()).map((d) => el('div', { className: 'card' },
          el('h3', { textContent: d.day }),
          ...Object.entries(LABELS).filter(([f]) => d.reflection?.[f]).map(([f, label]) =>
            el('div', { className: 'entry' }, el('div', { className: 'muted', textContent: label }), el('div', { className: 'text', textContent: d.reflection[f] }))),
          ...d.notes.map((n) => el('div', { className: 'entry row' },
            el('div', { className: 'grow' }, el('div', { className: 'muted', textContent: 'Done · ' + new Date(n.done_at).toLocaleTimeString() }), el('div', { className: 'text', textContent: n.text })),
            button('Restore', '', async () => { await pywebview.api.set_note_status(n.id, 'todo'); loadPast(); refresh(); }),
            button('Delete', '', async () => { await pywebview.api.delete_note(n.id); loadPast(); }))),
        ));
    if (q === search.value.trim()) document.getElementById('past-list').replaceChildren(...cards); // drop stale results
  }

  document.getElementById('search').oninput = loadPast;

  document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
    const section = b.closest('section');
    section.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
    section.querySelectorAll('.sub').forEach((s) => s.classList.toggle('hidden', s.id !== b.dataset.sub));
    if (b.dataset.sub === 'chat-list') loadChats();
    if (b.dataset.sub === 'today') loadToday();
    if (b.dataset.sub === 'past') loadPast();
  });

  document.querySelectorAll('.chips button').forEach((b) => b.onclick = () => {
    document.querySelectorAll('.chips button').forEach((x) => x.classList.toggle('on', x === b));
    filter = b.dataset.filter;
    renderBoard();
  });

  document.addEventListener('focusin', (e) => e.target.matches('input, textarea') && pywebview.api.typing(true));
  document.addEventListener('focusout', (e) => e.target.matches('input, textarea') && pywebview.api.typing(false));

  window.addEventListener('pywebviewready', () => {
    refresh();
    setInterval(refresh, 2000);
    setInterval(tick, 1000);
  });
</script>
</body>
</html>
